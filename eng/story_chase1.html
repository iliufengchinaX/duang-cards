<div class="card" data-k="s0"><div class="en"><b class="tw">Chase</b> had a bike that was <b class="tw">gray</b>.</div><div class="zh">Chase 有一辆灰色的自行车。</div><div class="btns"><button class="b n" data-k="s0" data-s="" type="button">🔊 正常</button><button class="b s" data-k="s0" data-s="_slow" type="button">🐢 慢速</button></div></div><div class="card" data-k="s1"><div class="en">He rode it down to the <b class="tw">bay</b>.</div><div class="zh">他骑车去了海湾。</div><div class="btns"><button class="b n" data-k="s1" data-s="" type="button">🔊 正常</button><button class="b s" data-k="s1" data-s="_slow" type="button">🐢 慢速</button></div></div><div class="card" data-k="s2"><div class="en">He saw a boat with a <b class="tw">sail</b>.</div><div class="zh">他看见一艘有帆的船。</div><div class="btns"><button class="b n" data-k="s2" data-s="" type="button">🔊 正常</button><button class="b s" data-k="s2" data-s="_slow" type="button">🐢 慢速</button></div></div><div class="card" data-k="s3"><div class="en">He watched a man deliver <b class="tw">mail</b>.</div><div class="zh">他看着一个人在送信。</div><div class="btns"><button class="b n" data-k="s3" data-s="" type="button">🔊 正常</button><button class="b s" data-k="s3" data-s="_slow" type="button">🐢 慢速</button></div></div>

const au=new Audio(); let cur=null;
function play(k, el){
  au.pause(); au.src=A[k]; au.currentTime=0;
  if(cur) cur.classList.remove('play');
  cur=el; el.classList.add('play');
  var p=au.play(); if(p&&p.catch) p.catch(function(){el.classList.remove('play')});
}
au.onended=au.onerror=function(){if(cur) cur.classList.remove('play')};
document.querySelectorAll('.card').forEach(function(c){
  c.addEventListener('click', function(e){
    var b=e.target.closest('button');
    var k=c.dataset.k+(b?b.dataset.s:'');
    play(k, c);
  });
});
document.querySelectorAll('.chip').forEach(function(c){
  c.addEventListener('click', function(e){
    e.stopPropagation();
    play(c.dataset.k, c);
  });
});
