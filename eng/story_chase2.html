<h1>Chase Loves to Play</h1>
<div class="author">by Andrew Frinkle</div>
</header>
<div class="card" data-k="s0"><div class="en">In winter he had a sled like a <b class="tw">sleigh</b>.</div><div class="zh">冬天他有一辆像雪橇一样的雪橇车。</div><div class="btns"><button class="b n" data-k="s0" data-s="" type="button">🔊 正常</button><button class="b s" data-k="s0" data-s="_slow" type="button">🐢 慢速</button></div></div><div class="card" data-k="s1"><div class="en">He slid by a horse that said, "<b class="tw">Neigh</b>!"</div><div class="zh">他滑过一匹马旁边，马叫了一声「嘶」。</div><div class="btns"><button class="b n" data-k="s1" data-s="" type="button">🔊 正常</button><button class="b s" data-k="s1" data-s="_slow" type="button">🐢 慢速</button></div></div><div class="card" data-k="s2"><div class="en">He wanted to sled all <b class="tw">day</b>!</div><div class="zh">他想一整天都滑雪橇！</div><div class="btns"><button class="b n" data-k="s2" data-s="" type="button">🔊 正常</button><button class="b s" data-k="s2" data-s="_slow" type="button">🐢 慢速</button></div></div><div class="card" data-k="s3"><div class="en">He really loved to <b class="tw">play</b>.</div><div class="zh">他真的很爱玩。</div><div class="btns"><button class="b n" data-k="s3" data-s="" type="button">🔊 正常</button><button class="b s" data-k="s3" data-s="_slow" type="button">🐢 慢速</button></div></div>

const au=new Audio(); let cur=null;
function play(k, el){
  au.pause(); au.src=A[k]; au.currentTime=0;
