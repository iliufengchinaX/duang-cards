function pack(A){const U={};for(const k in A)U[k]='data:audio/mpeg;base64,'+A[k];return U;}
let UF=pack(AF), UM=pack(AM), U=UF, voice='F';
let run=0,cur=null,curB=null;window.__ok=0;window.__err=null;window.__done=0;window.__voice=()=>voice;
const slow=()=>document.getElementById('slow').checked;
const mark=(b,i)=>b.querySelectorAll('.sp b').forEach((x,j)=>x.classList.toggle('cur',j===i));
function stop(){run++;if(cur)cur.pause();if(curB){curB.classList.remove('on');mark(curB,-1);}}
function setVoice(v){
  voice=v; U=(v==='M')?UM:UF;
  document.getElementById('vF').classList.toggle('sel',v==='F');
  document.getElementById('vM').classList.toggle('sel',v==='M');
  document.getElementById('vF').setAttribute('aria-pressed',v==='F'?'true':'false');
  document.getElementById('vM').setAttribute('aria-pressed',v==='M'?'true':'false');
  stop();
}
document.getElementById('vF').onclick=()=>setVoice('F');
document.getElementById('vM').onclick=()=>setVoice('M');
function playOne(src,a){return new Promise((res,rej)=>{a.src=src;a.playbackRate=slow()?0.75:1;a.preservesPitch=true;a.webkitPreservesPitch=true;
a.onended=()=>res();a.onerror=()=>rej(new Error('audio error'));const p=a.play();if(p)p.then(()=>window.__ok++).catch(rej);});}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelectorAll('button[data-seq]').forEach(b=>b.addEventListener('click',async()=>{
stop();const id=run;const seq=b.dataset.seq.split(',');const a=new Audio();cur=a;curB=b;b.classList.add('on');
try{for(let i=0;i<seq.length;i++){if(id!==run)return;const k=seq[i];if(!U[k])throw new Error('missing '+k+' voice='+voice);mark(b,seq.length>1?i:-1);await playOne(U[k],a);
if(i<seq.length-1){await sleep(slow()?800:500);}}window.__done++;}catch(e){window.__err=String(e);}
if(id===run){b.classList.remove('on');mark(b,-1);}
}));
