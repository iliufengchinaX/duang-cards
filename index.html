<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duang 的点读卡</title>
<style>
  :root{--ink:#1d1d1f;--sub:#86868b;--line:#e5e5ea;--eng:#2f6fde;--cn:#d9452b;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:var(--ink);background:#f5f5f7;padding:28px 18px 48px;max-width:560px;margin:0 auto}
  h1{font-size:28px;font-weight:700;letter-spacing:.5px}
  .tip{color:var(--sub);font-size:14px;margin:6px 0 26px}
  h2{font-size:15px;font-weight:600;color:var(--sub);margin:24px 0 10px;display:flex;align-items:center;gap:8px}
  h2 i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .eng h2 i{background:var(--eng)} .cn h2 i{background:var(--cn)}
  a.card{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:16px;padding:20px 20px;margin-bottom:12px;text-decoration:none;color:var(--ink);border:1px solid var(--line);min-height:72px}
  a.card:active{transform:scale(.98);background:#fafafa}
  .t{font-size:20px;font-weight:600}
  .d{font-size:13px;color:var(--sub);margin-top:4px}
  .arrow{font-size:22px;font-weight:600}
  .eng .arrow{color:var(--eng)} .cn .arrow{color:var(--cn)}
</style>
</head>
<body>
  <h1>Duang 的点读卡</h1>
  <p class="tip">点一张卡，打开就能听。</p>

  <section class="eng">
    <h2><i></i>英语</h2>
    <a class="card" href="eng/yz.html"><div><div class="t">Y / Z 单词点读</div><div class="d">zipper · yo-yo · zebra · yogurt …</div></div><span class="arrow">›</span></a>
  </section>

  <section class="cn">
    <h2><i></i>语文</h2>
    <a class="card" href="cn/jqx.html"><div><div class="t">j q x 作业点读卡</div><div class="d">拼音练习</div></div><span class="arrow">›</span></a>
  </section>
</body>
</html>
